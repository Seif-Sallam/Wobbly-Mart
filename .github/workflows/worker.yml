# Deploys the Board API Worker: staging on every push to release-03-leaderboard, production on main (merged only after the
# release gate). Runs its own typecheck, lint and Worker tests first, so a red gate never deploys.
# Never migrates: the owner applies D1 migrations by hand before the merge.
name: Worker deploy

on:
  push:
    branches: [release-03-leaderboard, main]
    paths:
      - 'worker/**'
      - 'catalog/**'
      - 'maps/**'
      - 'src/sim/**'
      - 'package-lock.json'
      - '.github/workflows/worker.yml'

permissions:
  contents: read

concurrency:
  group: worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'worker-production' || 'worker-staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run --project worker
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --env ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
